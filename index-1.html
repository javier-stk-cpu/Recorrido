<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de recorrido</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1c2326;--mut:#5d6b70;--line:#d9d6cd;--route:#0b6e8a;--go:#1c7c4d;--stop:#c0392b;--grid:#ebe8e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181b;--panel:#1b2428;--ink:#e8eef0;--mut:#93a4aa;--line:#2c383d;--route:#4cc3e0;--go:#4fc98a;--stop:#f0705f;--grid:#222d32}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181b;--panel:#1b2428;--ink:#e8eef0;--mut:#93a4aa;--line:#2c383d;--route:#4cc3e0;--go:#4fc98a;--stop:#f0705f;--grid:#222d32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 14px;letter-spacing:-.01em}
h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.status{color:var(--mut);margin:0 0 4px}
.big{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:0}
.sub{color:var(--mut);margin:2px 0 12px;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.go,.stop{min-height:58px;font-weight:700;color:#fff;border:0;font-size:1.05rem}
.go{background:var(--go)}.stop{background:var(--stop)}
:root[data-theme="dark"] .go,:root[data-theme="dark"] .stop{color:#0b1114}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go,:root:not([data-theme="light"]) .stop{color:#0b1114}}
button:disabled{opacity:.4;cursor:not-allowed}
.msg{color:var(--stop);margin:10px 0 0;min-height:1.2em;font-size:.92rem}
svg{width:100%;height:auto;display:block;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
svg .t{fill:var(--mut);font-size:13px}
.grid{stroke:var(--grid);stroke-width:1}
.line{fill:none;stroke:var(--route);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pt{fill:var(--route)}.hit{fill:transparent;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stats span{color:var(--mut);font-size:.82rem}
.info{color:var(--mut);margin:10px 0 0;font-size:.92rem;min-height:1.3em}
.link{display:inline-block;margin-top:10px;color:var(--route);font-weight:600}
.item{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.item .pick{flex:1;text-align:left;padding:10px 12px}
.item .pick.on{border-color:var(--route);box-shadow:inset 0 0 0 1px var(--route)}
.item small{display:block;color:var(--mut)}
.del{min-width:84px}
.empty{color:var(--mut);margin:0}
</style></head>
<body><div class="wrap">
<h1>Control de recorrido</h1>

<section class="card" aria-label="Control">
  <p class="status" id="status">Sin control activo</p>
  <p class="big" id="clock">00:00</p>
  <p class="sub" id="sub">Registra la ubicación cada 1 minuto, hasta 60 minutos.</p>
  <div class="btns">
    <button class="go" id="bStart">Iniciar control</button>
    <button class="stop" id="bStop" disabled>Finalizar control</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
</section>

<section class="card" aria-label="Mapa del recorrido">
  <h2 id="mapTitle">Recorrido</h2>
  <svg id="map" viewBox="0 0 360 360" role="img" aria-label="Trazado del recorrido"></svg>
  <div class="stats">
    <div><b id="sDist">–</b><span>Distancia</span></div>
    <div><b id="sTime">–</b><span>Duración</span></div>
    <div><b id="sSpeed">–</b><span>Vel. media</span></div>
  </div>
  <p class="info" id="info">Tocá un punto del trazado para ver su hora y precisión.</p>
  <a class="link" id="gmaps" href="#" target="_blank" rel="noopener" hidden>Abrir en Google Maps</a>
</section>

<section class="card" aria-label="Recorridos guardados">
  <h2>Recorridos guardados</h2>
  <div id="list"></div>
</section>
</div>

<script>
const KEY="recorridos_v1", ACT="activo_v1", MAXMS=3600000, EVERY=60000;
let store=[], rec=null, tSample=null, tTick=null, wake=null, selId=null, delArm=null, lastMsg="";
const $=id=>document.getElementById(id);

function read(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
function say(t){$("msg").textContent=t||""}

function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function dist(P){let d=0;for(let i=1;i<P.length;i++)d+=hav(P[i-1],P[i]);return d}
function mmss(ms){const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function km(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(2)+" km"}
function when(t){return new Date(t).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function hhmm(t){return new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}
function dur(r){const P=r.pts;return P.length?(r.end||P[P.length-1].t)-P[0].t:0}

function getPoint(){return new Promise((ok,no)=>{
  navigator.geolocation.getCurrentPosition(p=>ok({t:Date.now(),lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),no,{enableHighAccuracy:true,timeout:30000,maximumAge:0})})}
function geoError(e){return e&&e.code===1?"Permiso de ubicación denegado. Activalo en los ajustes del navegador y probá de nuevo.":"No se pudo leer la ubicación. Revisá que el GPS esté encendido."}

async function lockScreen(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}}
function unlockScreen(){try{if(wake)wake.release()}catch(e){}wake=null}

async function start(){
  if(rec)return;
  if(!navigator.geolocation){say("Este navegador no permite leer la ubicación.");return}
  say("");$("bStart").disabled=true;$("status").textContent="Buscando señal GPS…";
  let p;try{p=await getPoint()}catch(e){say(geoError(e));$("status").textContent="Sin control activo";$("bStart").disabled=false;return}
  rec={id:p.t,start:p.t,end:null,pts:[p]};selId=null;
  write(ACT,rec);lockScreen();
  tSample=setInterval(sample,EVERY);tTick=setInterval(tick,1000);
  $("bStop").disabled=false;render();
}
async function sample(){
  if(!rec)return;
  const id=rec.id;
  try{const p=await getPoint();if(!rec||rec.id!==id)return;rec.pts.push(p);write(ACT,rec);say("")}
  catch(e){say("Un punto no se pudo leer; el control sigue.")}
  if(rec&&Date.now()-rec.pts[0].t>=MAXMS)finish();else render();
}
function tick(){
  if(!rec)return;
  const el=Date.now()-rec.pts[0].t;
  if(el>=MAXMS+15000){finish();return}
  $("clock").textContent=mmss(el);
  const next=EVERY-(Date.now()-rec.pts[rec.pts.length-1].t);
  $("sub").textContent="Quedan "+mmss(MAXMS-el)+" de 60:00 · próximo punto en "+Math.max(0,Math.round(next/1000))+" s";
}
function finish(){
  if(!rec)return;
  clearInterval(tSample);clearInterval(tTick);unlockScreen();
  const r=rec;rec=null;r.end=r.pts[r.pts.length-1].t;
  store.unshift(r);write(KEY,store);drop(ACT);selId=r.id;
  $("bStop").disabled=false;$("bStop").disabled=true;$("bStart").disabled=false;
  $("status").textContent="Control finalizado";$("clock").textContent=mmss(dur(r));
  $("sub").textContent="Se guardaron "+r.pts.length+" puntos.";
  render();
}

function draw(r){
  const svg=$("map");
  if(!r||!r.pts.length){svg.innerHTML='<text x="180" y="184" text-anchor="middle" class="t">Todavía no hay recorrido para dibujar</text>';return}
  const P=r.pts,la=P.map(p=>p.lat),lo=P.map(p=>p.lon);
  const a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo);
  const k=Math.cos((a+b)/2*Math.PI/180),w=(d-c)*k,h=b-a,S=290/Math.max(w,h,0.0002);
  const ox=180-w*S/2,oy=170-h*S/2,X=p=>ox+(p.lon-c)*k*S,Y=p=>oy+(b-p.lat)*S;
  let s="";for(let i=0;i<=360;i+=60)s+=`<line class="grid" x1="${i}" y1="0" x2="${i}" y2="360"/><line class="grid" x1="0" y1="${i}" x2="360" y2="${i}"/>`;
  if(P.length>1)s+=`<polyline class="line" points="${P.map(p=>X(p).toFixed(1)+","+Y(p).toFixed(1)).join(" ")}"/>`;
  P.forEach((p,i)=>{s+=`<circle class="pt" cx="${X(p).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="3"/><circle class="hit" data-i="${i}" cx="${X(p).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="12"/>`});
  const f=P[0],e=P[P.length-1];
  s+=`<circle cx="${X(f).toFixed(1)}" cy="${Y(f).toFixed(1)}" r="8" fill="var(--go)" stroke="var(--panel)" stroke-width="3"/>`;
  if(P.length>1)s+=`<circle cx="${X(e).toFixed(1)}" cy="${Y(e).toFixed(1)}" r="8" fill="var(--stop)" stroke="var(--panel)" stroke-width="3"/>`;
  const ppm=S/111320,ms=[10,20,50,100,200,500,1000,2000,5000,10000,20000,50000],m=ms.find(v=>v*ppm>=70)||ms[ms.length-1],px=Math.min(m*ppm,200);
  s+=`<line x1="16" y1="342" x2="${16+px}" y2="342" stroke="var(--ink)" stroke-width="2"/><text class="t" x="16" y="334">${m>=1000?m/1000+" km":m+" m"}</text><text class="t" x="338" y="22">N</text>`;
  svg.innerHTML=s;
}
function gmaps(r){
  const P=r.pts;if(P.length<2)return "";
  const q=p=>p.lat.toFixed(6)+","+p.lon.toFixed(6),mid=P.slice(1,-1),n=Math.min(8,mid.length),w=[];
  for(let i=0;i<n;i++)w.push(q(mid[Math.floor(i*mid.length/n)]));
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+q(P[0])+"&destination="+q(P[P.length-1])+(w.length?"&waypoints="+encodeURIComponent(w.join("|")):"");
}
function render(){
  const r=rec||store.find(x=>x.id===selId)||null;
  $("mapTitle").textContent=rec?"Recorrido en curso":r?"Recorrido del "+when(r.start):"Recorrido";
  draw(r);
  if(r){const D=dist(r.pts),T=dur(r);
    $("sDist").textContent=km(D);$("sTime").textContent=mmss(T);
    $("sSpeed").textContent=T>0?(D/1000/(T/3600000)).toFixed(1)+" km/h":"–";
    const g=rec?"":gmaps(r);$("gmaps").hidden=!g;if(g)$("gmaps").href=g;
    $("info").textContent=r.pts.length+" puntos. Tocá uno del trazado para ver su hora y precisión.";
  }else{["sDist","sTime","sSpeed"].forEach(i=>$(i).textContent="–");$("gmaps").hidden=true}
  if(rec){$("status").textContent="Controlando ubicación";tick()}
  const L=$("list");
  if(!store.length){L.innerHTML='<p class="empty">Cuando finalices un control, el recorrido queda guardado acá.</p>';return}
  L.innerHTML=store.map(x=>`<div class="item"><button class="pick ${x.id===selId&&!rec?"on":""}" data-id="${x.id}">${when(x.start)}<small>${x.pts.length} puntos · ${km(dist(x.pts))} · ${mmss(dur(x))}</small></button><button class="del" data-del="${x.id}">${delArm===x.id?"Confirmar":"Borrar"}</button></div>`).join("");
}

$("bStart").onclick=start;
$("bStop").onclick=finish;
$("map").addEventListener("click",e=>{
  const i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i==null)return;
  const r=rec||store.find(x=>x.id===selId);if(!r)return;const p=r.pts[+i];
  $("info").textContent="Punto "+(+i+1)+" de "+r.pts.length+" · "+hhmm(p.t)+" · precisión "+p.acc+" m";
});
$("list").addEventListener("click",e=>{
  const pick=e.target.closest("[data-id]"),del=e.target.closest("[data-del]");
  if(pick&&!rec){selId=+pick.dataset.id;delArm=null;render()}
  else if(pick&&rec){say("Finalizá el control en curso para ver otros recorridos.")}
  if(del){const id=+del.dataset.del;
    if(delArm===id){store=store.filter(x=>x.id!==id);write(KEY,store);if(selId===id)selId=null;delArm=null}else delArm=id;
    render()}
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&rec){lockScreen();if(Date.now()-rec.pts[rec.pts.length-1].t>=EVERY+5000)sample()}
});

store=read(KEY,[]);
const old=read(ACT,null);
if(old&&old.pts&&old.pts.length){old.end=old.pts[old.pts.length-1].t;store.unshift(old);write(KEY,store);selId=old.id;
  say("Un control anterior se interrumpió y se guardó con los puntos que alcanzó a registrar.")}
drop(ACT);
if(!selId&&store.length)selId=store[0].id;
render();
</script></body></html>
